# Slack app for the Executive (Socket Mode: no public URL or webhook).
# api.slack.com/apps -> Create New App -> From an app manifest -> paste this.
# Then: Basic Information -> App-Level Tokens -> scope connections:write
# (SLACK_APP_TOKEN, xapp-...); Install App (SLACK_BOT_TOKEN, xoxb-...).
# The scopes match what integrations/slack_bot.py uses: mentions, DMs,
# thread reads, shared files, reactions and user lookups.
display_information:
  name: Hoiv Executive
features:
  bot_user:
    display_name: Executive
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - im:history
      - im:read
      - im:write
      - channels:history
      - groups:history
      - files:read
      - reactions:write
      - users:read
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.im
      - message.channels
      - message.groups
  interactivity:
    is_enabled: false
  socket_mode_enabled: true
