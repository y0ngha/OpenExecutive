# Copy outside the repo (e.g. ~/Desktop/oe), fill it in, keep it private
# (chmod 600), then:
#   uv run --with pyyaml --with cryptography python deploy/oracle/env-from-yaml.py \
#     ~/Desktop/oe deploy/oracle
# Tabs or spaces both work for indentation. Leave a value blank to skip it.

domain: app.example.com          # the A record pointing at the server
acme_email: you@example.com      # Let's Encrypt notices (the maintainer)

google_oauth:                    # redirect URI: https://<domain>/api/auth/callback/google
    client_id: 1234.apps.googleusercontent.com
    client_secret: GOCSPX-...

anthropic:
    key: sk-ant-...

users:                           # name: Google sign-in email
    alice: alice@example.com
    bob: bob@example.com
owner: alice                     # signs in first; the only one allowed until the
                                 # owner adds the others on the People page

exec_email_address: exec@app.example.com   # needs no mailbox while mail is off
exec_display_name: Hoiv Executive
oe_language: ko                  # en or ko
timezone: Asia/Seoul

slack:                           # optional; deploy/oracle/slack-manifest.yaml
    app_token: xapp-...
    bot_user_oauth: xoxb-...
    member_id:                   # not used here: entered on the People page
        alice: U0123456789
        bob: U0987654321

only_slack: true                 # explicitly switch every other integration off
